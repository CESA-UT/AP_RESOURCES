name: Build Rankings

on:
  push:
    branches:
      - main
      - master
    paths:
      - "*/ranking.md"
      - "scripts/build_rankings.py"
      - ".github/workflows/build-rankings.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build central ranking
        run: python scripts/build_rankings.py

      - name: Commit generated ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking.md
          git diff --cached --quiet || git commit -m "chore: rebuild AP_RESOURCES ranking"
          git push
